[project]
name = "agent-spend-guard"
version = "0.1.0"
description = "A safety layer for AI agents that spend money: payment gate, signed-approval verifier, MCP server and evals."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "openai-agents>=0.24.0",
    "pydantic>=2",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
redis = [
    "redis>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spend_guard", "mock_api", "mcp_server", "integrations", "evals", "demo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # Starlette's TestClient prefers the httpx2 package; httpx still works and is what the
    # client in spend_guard uses, so this one deprecation notice is silenced.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.40.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.3",
]
